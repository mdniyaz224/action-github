name: jobbs test
on: push
jobs:
	validate-file:
		runs-on: ubuntu-latest
		steps:
			- name: Get repository code
				uses: actions/checkout@v4
			- name: Check HTML file
				run: test -f public/index.html

	build-app:
		needs: validate-file
		runs-on: ubuntu-latest
		steps:
			- name: Get repository code
				uses: actions/checkout@v4
			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: npm
			- name: Install dependencies
				run: npm ci
			- name: Build application
				run: npm run build

	finish:
		needs: build-app
		runs-on: ubuntu-latest
		steps:
			- name: Report success
				run: echo "All jobs completed successfully"